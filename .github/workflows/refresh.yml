# Monthly OpenHousing data refresh.
#
# Runs the whole pipeline (fetch -> index -> validate -> publish) and the
# tests, then commits the updated data, but only if everything passed. On any
# failure it opens (or comments on) a GitHub Issue saying which step failed and
# why; nothing is committed, so the site keeps the last good dataset.
#
# Secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   CENSUS_API_KEY, HUD_API_TOKEN, FRED_API_KEY   (see docs/AUTOMATION.md)
#
# Note: GitHub only runs scheduled workflows from the default branch, so the
# monthly schedule starts once this file is on `main`. "Run workflow" works
# from any branch that has it.

name: Monthly data refresh

on:
  schedule:
    # 14:00 UTC on the 20th of each month: after Zillow's monthly release
    # (published on the 16th) and a fresh weekly mortgage rate.
    - cron: "0 14 20 * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the refreshed data
  issues: write     # open an issue on failure

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        # Explicit bash = "bash -eo pipefail": without pipefail, `python ... | tee`
        # would report success even when python fails.
        shell: bash
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Check that API key secrets exist
        id: secrets
        run: |
          missing=""
          for k in CENSUS_API_KEY HUD_API_TOKEN FRED_API_KEY; do
            if [ -z "${!k}" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See docs/AUTOMATION.md."
            exit 1
          fi

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        id: install
        run: pip install -r requirements.txt

      # Raw downloads are cached between runs so reruns don't hit the sources
      # again, and the 95 MB Zillow file is reused when it hasn't changed.
      - name: Restore download cache
        id: cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Run pipeline (fetch, index, validate, publish)
        id: pipeline
        run: python scripts/refresh_data.py 2>&1 | tee refresh.log

      - name: Run tests
        id: tests
        run: python -m pytest -q 2>&1 | tee -a refresh.log

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          vintages=$(python -c "import json; m=json.load(open('data/manifest.json')); print('; '.join(s['vintage'] for s in m['sources']))")
          git commit -m "Data refresh $(date -u +%Y-%m-%d)" -m "Validated and published by the monthly refresh workflow." -m "Vintages: $vintages"
          git push

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed="unknown step"
          for s in "secrets:Check that API key secrets exist:${{ steps.secrets.outcome }}" \
                   "install:Install dependencies:${{ steps.install.outcome }}" \
                   "pipeline:Run pipeline:${{ steps.pipeline.outcome }}" \
                   "tests:Run tests:${{ steps.tests.outcome }}" \
                   "commit:Commit updated data:${{ steps.commit.outcome }}"; do
            outcome="${s##*:}"; rest="${s%:*}"; label="${rest#*:}"
            if [ "$outcome" = "failure" ]; then failed="$label"; break; fi
          done
          python scripts/ci_issue_body.py --failed-step "$failed" --log refresh.log --run-url "$RUN_URL" > issue.md || \
            printf '## Monthly data refresh failed\n\n**Failed step:** %s\n\n%s\n' "$failed" "$RUN_URL" > issue.md
          gh label create data-refresh-failure --color B60205 \
            --description "Automated monthly data refresh failed" --force
          existing=$(gh issue list --label data-refresh-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh issue create --title "Data refresh failed: $failed ($(date -u +%Y-%m-%d))" \
              --label data-refresh-failure --body-file issue.md
          fi

      - name: Save logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-reports
          path: |
            refresh.log
            data/interim/run_summary.json
            data/build/validation.json
          if-no-files-found: ignore
          retention-days: 30
