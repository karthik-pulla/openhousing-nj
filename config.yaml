# OpenHousing v2 configuration. Every assumption the pipeline makes lives here,
# so it can be shown in the UI and in METHODOLOGY.md. Change a value here, rerun
# scripts/refresh_data.py, and the index, docs table and site all follow.

sources:
  acs:
    # null = use the newest ACS 5-year release the Census API serves (checked each run).
    year: null
  zillow:
    url: https://files.zillowstatic.com/research/public_csvs/zhvi/City_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv
    series: "ZHVI All Homes (SFR, Condo/Co-op), middle tier (35th-65th percentile), smoothed, seasonally adjusted"
    # How a town's value is formed from its Zillow regions:
    #   town_region_first: use the region named after the town itself if there is one; otherwise
    #   the housing-unit-weighted mean of the community (CDP) regions inside it.
    aggregation: town_region_first
    # Zillow's terms for republishing research data are not yet confirmed
    # (docs/SOURCES_VERIFICATION.md). While false, the published index uses ACS
    # home values only; `--preview-zillow` builds a local, gitignored comparison.
    cleared_for_publication: false
  redfin:
    # Disabled: Redfin now offers only form-generated CSV downloads, and its Terms of Use
    # (sec. 2.3.3-2.3.5) bar redistribution and automated querying without written permission.
    # See docs/SOURCES_VERIFICATION.md.
    enabled: false
  property_tax:
    # NJ DCA Division of Local Government Services "Property Tax Tables" (one .xls per tax year).
    page: https://www.nj.gov/dca/dlgs/resources/Property_Tax_info.shtml
    url_pattern: https://www.nj.gov/dca/dlgs/resources/Property_Tax/{yy}_data/{yy}taxes.xls
  hud:
    base: https://www.huduser.gov/hudapi/public
    year: null              # null = HUD's latest
    seconds_between_calls: 1.1   # HUD limit is 60 calls/minute
  fred:
    series: MORTGAGE30US
    # Rate used for ownership cost: mean of the last N weekly observations
    # (smooths week-to-week noise). 4 weeks ~= one month.
    trailing_weeks: 4
  nzlud:
    upstream: https://raw.githubusercontent.com/mtmleczko/nzlud/main/nzlud_muni.csv
    local: data/static/nzlud/nzlud_muni.csv
  fourth_round:
    pdf: data/static/fourth_round/FourthRoundCalculation_Methodology.pdf
    csv: data/static/fourth_round/obligations_dca_2024.csv

# --------------------------------------------------------------------------- index
index:
  # A. Affordability (the outcome): two separate scores, because owning and
  # renting are largely separate markets (decision 2026-11-19). Each measure is
  # converted to a percentile rank across municipalities (higher = more affordable);
  # a score is the weighted mean of its measures' percentiles, rescaled over the
  # measures a town has. Both scores measure PRICES relative to regional income.
  # Barriers (zoning, obligations) are never in either score.
  scores:
    ownership:
      weights:
        ownership_burden: 1      # annual ownership cost / county median household income
    rental:
      weights:
        rent_burden: 1           # 12 x median gross rent / county median household income
  # Shown on town profiles as context, NOT scored: the share of renter households
  # paying 30%+ of their own income on rent. It reflects residents' incomes rather
  # than housing prices (rank correlation with the price measures is about 0) and is
  # unreliable in small towns. Add it to a score's weights to include it.
  context_measures: [renters_cost_burdened]
  # Income used as the denominator. "county" avoids comparing a wealthy town to its
  # own wealthy residents and matches Mount Laurel's regional framing. Town-income
  # burdens are also published, for display.
  denominator: county
  # A town needs at least this many of a score's measures to get that score.
  min_components: 1

ownership:
  # Annual ownership cost = mortgage principal & interest + average residential property tax bill.
  down_payment_pct: 20           # 20% down, so no private mortgage insurance applies
  loan_term_years: 30
  # Mortgage rate: FRED MORTGAGE30US, mean of sources.fred.trailing_weeks weeks.
  excluded_costs: [homeowners insurance, private mortgage insurance, HOA or condo fees,
                   maintenance, utilities, closing costs]
  # Home value source priority (first available wins; Redfin is not used, see sources.redfin).
  home_value_priority: [zillow, acs]

ami_view:
  # Third view (shown, not scored): can a household at HUD's 80% of area median income afford it?
  income_limit: il80             # HUD "low income" limit
  household_size: 4              # HUD's base household size
  affordable_share: 0.30         # housing costs at or below 30% of income = affordable

confidence:
  # Coefficient of variation of an ACS estimate: CV = (MOE / 1.645) / estimate.
  # Common practice (e.g. Esri's ACS reliability tiers): CV <= 12% high, 12-40% medium, > 40% low.
  cv_high_max: 0.12
  cv_medium_max: 0.40
  # Source-based cap: an ACS median home value is a 5-year average of what owners
  # think their home is worth, not a current market price, so a home value from
  # ACS can be at most this confident even when its margin of error is small.
  acs_home_value_max_confidence: medium
  # A score's flag = the weakest confidence among the measures it uses; a missing
  # measure caps the flag at "medium", two or more at "low". No measure at all =
  # "insufficient data" (the town is kept, with no score).
  overall_rule: weakest_component
  # Zillow vs ACS home value: a town is flagged when its Zillow/ACS ratio differs
  # from the statewide median ratio by more than this factor (ACS is owner-reported
  # and averages 5 years, so it runs below Zillow everywhere).
  value_disagreement_factor: 1.30
